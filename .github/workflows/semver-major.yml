---
name: Auto Semver
on:
  pull_request_target:
    types: closed
    branches:
      - main

jobs:
  update:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Run Semantic Version tagging action
        id: semver
        uses: discoverygarden/auto-semver@main
      - name: Update Major Tag
        # Only move the major tag when the semver step succeeded and actually
        # minted a new tag (it outputs nothing on a `no-update` label).
        if: success() && steps.semver.outputs.tag != ''
        uses: discoverygarden/action-major-tag@v1
        with:
          prefix: 'v'
